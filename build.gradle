plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

// Общие версии семейства: текущие jar-ы и версии модов из ../_family (python _family/family.py sync).
if (file('../_family/family.gradle').exists()) apply from: '../_family/family.gradle'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            jvmArg '-Dfile.encoding=UTF-8'
            // Миксины чужих модов (TaCZ, LSO…) в среде разработки.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('run/client')
            if (project.hasProperty('quickplay')) args '--quickPlayMultiplayer', project.property('quickplay')
            if (project.hasProperty('username')) args '--username', project.property('username')
        }

        server {
            args '--nogui'
        }

        // Игровые тесты (faygolover/rppsyche/gametest): ./gradlew runGameTestServer — сервер стартует, гоняет тесты и выходит.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

tasks.matching { it.name == 'runServer' }.configureEach { standardInput = System.in }

repositories {
    // RP Core, RP Medicine и соседи по семейству, Zone Artifacts — jar в libs/.
    flatDir { dir 'libs' }
    // Моды сборки для проверки (-Pwith_pack=true): TaCZ, Simple Voice Chat… — jar в libs/pack как <имя>-1.jar.
    flatDir { dir 'libs/pack' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'Henkelmax'
        url = 'https://maven.maxhenkel.de/repository/public'
        content { includeGroup 'de.maxhenkel.voicechat' }
    }
}

def flag = { String name -> (project.findProperty(name) ?: 'false').toString().toBoolean() }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Обязателен только RP Core (черты, ощущения, речь, время RP, мод тела).
    implementation fg.deobf("blank:rpcore:${rpcore_version}")
    // RP Medicine — необязательна: боль, нокдаун, лекарства приходят через мод тела RP Core. В разработке стоит,
    // чтобы тесты и клиент шли как на сервере; проверка без неё: -Pno_medicine=true.
    if (!flag('no_medicine')) runtimeOnly fg.deobf("blank:rpmedicine:${rpmedicine_version}")

    // Необязательные: только для компиляции, код интеграций загружается, лишь когда мод установлен.
    compileOnly fg.deobf("maven.modrinth:timeless-and-classics-zero:${tacz_version}")
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    compileOnly fg.deobf("blank:fl_zone_arts:${zoneartifacts_version}")

    // В разработке — с RP Perks (черты) и RP PDA (речь через КПК): -Pno_perks=true / -Pno_pda=true — без них.
    if (!flag('no_perks')) runtimeOnly fg.deobf("blank:rpperks:${rpperks_version}")
    if (!flag('no_pda')) runtimeOnly fg.deobf("blank:rppda:${rppda_version}")
    if (flag('with_za')) runtimeOnly fg.deobf("blank:fl_zone_arts:${zoneartifacts_version}")
    if (flag('with_pack')) {
        fileTree('libs/pack').matching { include '*-1.jar' }.each { f ->
            runtimeOnly fg.deobf("blank:${f.name.replace('-1.jar', '')}:1")
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    // Игровые тесты и их площадка в сборку для игроков не идут.
    exclude 'faygolover/rppsyche/gametest/**', 'data/rppsyche/structures/**'
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
